<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CartShare | Checkout</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body data-page="checkout">
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="room.html">
                <span class="brand-mark" aria-hidden="true">C</span> CartShare
            </a>
            <span class="navbar-text">Checkout</span>
        </div>
    </nav>

    <main class="cart-page checkout-page">
        <div class="container">
            <div class="cart-header">
                <div>
                    <span class="small-label">ORDER DETAILS</span>
                    <h1>Checkout</h1>
                    <p>Review your room's items and provide delivery details.</p>
                </div>
                <div class="room-code-box">
                    <span>ROOM</span>
                    <strong id="checkoutRoomCode"></strong>
                </div>
            </div>

            <div class="checkout-layout">
                <section class="cart-card checkout-summary" aria-labelledby="checkoutItemsHeading">
                    <div class="cart-card-header">
                        <h2 id="checkoutItemsHeading">Order summary</h2>
                        <span id="checkoutItemCount" class="panel-count">0 items</span>
                    </div>
                    <div id="checkoutItems" class="checkout-item-list"></div>
                    <div class="cart-total">
                        <span>Grand total</span>
                        <strong id="checkoutTotal">₹0.00</strong>
                    </div>
                    <a href="cart.html" class="back-link">← Back to cart</a>
                </section>

                <section class="add-item-card checkout-form-card" aria-labelledby="deliveryHeading">
                    <span class="small-label">DELIVERY</span>
                    <h2 id="deliveryHeading">Where should we send it?</h2>
                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label for="customerName">Customer name</label>
                            <input id="customerName" name="customerName" class="form-control" type="text" maxlength="48" autocomplete="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="contactNumber">Contact number</label>
                            <input id="contactNumber" name="contactNumber" class="form-control" type="tel" inputmode="tel" minlength="7" maxlength="20" autocomplete="tel" placeholder="Phone number" required>
                        </div>
                        <div class="mb-3">
                            <label for="deliveryAddress">Delivery address</label>
                            <textarea id="deliveryAddress" name="deliveryAddress" class="form-control checkout-address" maxlength="300" autocomplete="street-address" placeholder="Street, area, city, postal code" required></textarea>
                        </div>
                        <p id="checkoutError" class="checkout-error" role="alert" hidden></p>
                        <button id="placeOrderButton" class="btn-primary-custom form-submit" type="submit">Place Order</button>
                        <p class="checkout-note">Order placement is a frontend simulation. No payment will be collected.</p>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js?v=1"></script>
    <script src="js/script.js?v=4"></script>
</body>
</html>
