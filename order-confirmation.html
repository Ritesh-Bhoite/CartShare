<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CartShare | Order Confirmation</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body data-page="confirmation">
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="room.html">
                <span class="brand-mark" aria-hidden="true">C</span> CartShare
            </a>
            <span class="navbar-text">Order confirmation</span>
        </div>
    </nav>

    <main class="cart-page confirmation-page">
        <div class="container confirmation-container">
            <section class="confirmation-card" aria-labelledby="confirmationTitle">
                <div class="confirmation-mark" aria-hidden="true">✓</div>
                <span class="small-label">ORDER PLACED</span>
                <h1 id="confirmationTitle">Your order is confirmed.</h1>
                <p class="confirmation-copy">Your order details are saved with this shopping room.</p>

                <div class="confirmation-meta">
                    <div><span>Order ID</span><strong id="confirmationOrderId"></strong></div>
                    <div><span>Customer</span><strong id="confirmationCustomer"></strong></div>
                    <div><span>Room code</span><strong id="confirmationRoom"></strong></div>
                    <div><span>Date and time</span><strong id="confirmationDate"></strong></div>
                </div>

                <div class="confirmation-items-wrap">
                    <h2>Ordered items</h2>
                    <div id="confirmationItems" class="checkout-item-list"></div>
                </div>

                <div class="cart-total confirmation-total">
                    <span>Grand total</span>
                    <strong id="confirmationTotal">₹0.00</strong>
                </div>

                <div class="confirmation-actions">
                    <a id="viewOrderReceipt" class="btn-primary-custom" href="room.html">View Receipt</a>
                    <a class="btn-secondary-custom" href="room.html">Back to Room</a>
                </div>
            </section>
        </div>
    </main>

    <script src="js/script.js?v=5"></script>
</body>
</html>
